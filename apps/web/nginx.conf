server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Todo pasa por el mismo origen (mismo host y puerto que ve el navegador): la API queda
    # detras de /api/, proxied internamente al contenedor "api" en la red de Docker. Se evita asi
    # cualquier ambiguedad de navegador con cookies/CORS entre puertos distintos del mismo host
    # (que es justo lo que fallaba en Safari de iOS con el diseno anterior de dos puertos).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tailscale Serve termina el TLS y reenvia a este nginx en HTTP simple (nunca vemos HTTPS
        # aqui, asi que "$scheme" siempre valdria "http" aunque el usuario real este en HTTPS) —
        # se fija explicitamente porque en este despliegue SIEMPRE se llega hasta aqui via
        # Tailscale Serve en HTTPS. Sin esto, la API cree que la conexion es insegura y
        # express-session se niega a enviar la cookie "secure" (sesion nunca persiste).
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA: cualquier ruta que no sea un fichero real cae en index.html, para que el enrutado de
    # react-router funcione con recargas directas (ej. /transactions) y no de 404 en nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
