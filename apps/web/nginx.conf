server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un fichero real cae en index.html, para que el enrutado de
    # react-router funcione con recargas directas (ej. /transactions) y no de 404 en nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
